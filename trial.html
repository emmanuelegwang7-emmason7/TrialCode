<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Calculator</title>
    <style>
        body {
        font-family:Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #610aee;
        }
       
        .calculator {
            border: 1px solid #181717;
            border-radius: 10px;
            padding: 20px;
            background-color: rgb(15, 182, 79);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            width: 90%;
            max-width: 350px;
            margin: auto;
        }
       
        .display {
            width: 100%;
            height: 60px;
            margin-bottom: 15px;
            font-size: 28px;
            text-align: right;
            padding: 5px 10px;
            box-sizing: border-box;
            border: 1px solid #ddd;
            border-radius: 5px;
            background-color: #f9f9f9;
        }
       
        .memory-display {
            text-align: right;
            height: 20px;
            margin-bottom: 5px;
            color: #666;
            font-size: 14px;
        }
       
        .buttons {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
        }
       
        button {
            height: 50px;
            font-size: 18px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            background-color: #b9acac;
            transition: all 0.2s;
        }
       
        button:hover {
            background-color: #e0e0e0;
        }
       
        .operator {
            background-color: #8a7350;
            color: white;
        }
       
        .operator:hover {
            background-color: #f57c00;
        }
       
        .equals {
            background-color: #4caf50;
            color: white;
        }
       
        .equals:hover {
            background-color: #388e3c;
        }
       
        .clear {
            background-color: #f44336;
            color: white;
        }
       
        .clear:hover {
            background-color: #d32f2f;
        }
       
        .scientific {
            background-color: #9e9e9e;
            color: white;
            font-size: 16px;
        }
       
        .scientific:hover {
            background-color: #757575;
        }
       
        .memory {
            background-color: #607d8b;
            color: white;
            font-size: 16px;
        }
       
        .memory:hover {
            background-color: #455a64;
        }
    </style>
</head>
<body>
    <div class="calculator">
        <div class="memory-display" id="memory-display">Memory: 0</div>
        <input type="text" class="display" id="display" readonly>
        <div class="buttons">
            <button onclick="memoryRecall()" class="memory">MR</button>
            <button onclick="memoryClear()" class="memory">MC</button>
            <button onclick="memoryAdd()" class="memory">M+</button>
            <button onclick="memorySubtract()" class="memory">M-</button>
            <button onclick="clearDisplay()" class="clear">C</button>
           
            <button onclick="appendToDisplay('(')" class="scientific">(</button>
            <button onclick="appendToDisplay(')')" class="scientific">)</button>
            <button onclick="appendToDisplay('Math.PI')" class="scientific">π</button>
            <button onclick="appendToDisplay('Math.E')" class="scientific">e</button>
            <button onclick="backspace()" class="clear">⌫</button>
           
            <button onclick="squareRoot()" class="scientific">√</button>
            <button onclick="power(2)" class="scientific">x²</button>
            <button onclick="power(3)" class="scientific">x³</button>
            <button onclick="powerFunction()" class="scientific">x^y</button>
            <button onclick="appendToDisplay('/')" class="operator">÷</button>
           
            <button onclick="scientificFunction('Math.sin')" class="scientific">sin</button>
            <button onclick="scientificFunction('Math.cos')" class="scientific">cos</button>
            <button onclick="scientificFunction('Math.tan')" class="scientific">tan</button>
            <button onclick="scientificFunction('Math.log')" class="scientific">log</button>
            <button onclick="appendToDisplay('*')" class="operator">×</button>
           
            <button onclick="scientificFunction('Math.asin')" class="scientific">sin⁻¹</button>
            <button onclick="scientificFunction('Math.acos')" class="scientific">cos⁻¹</button>
            <button onclick="scientificFunction('Math.atan')" class="scientific">tan⁻¹</button>
            <button onclick="factorial()" class="scientific">n!</button>
            <button onclick="appendToDisplay('-')" class="operator">-</button>
           
            <button onclick="appendToDisplay('7')">7</button>
            <button onclick="appendToDisplay('8')">8</button>
            <button onclick="appendToDisplay('9')">9</button>
            <button onclick="percentage()" class="scientific">%</button>
            <button onclick="appendToDisplay('+')" class="operator">+</button>
           
            <button onclick="appendToDisplay('4')">4</button>
            <button onclick="appendToDisplay('5')">5</button>
            <button onclick="appendToDisplay('6')">6</button>
            <button onclick="reciprocal()" class="scientific">1/x</button>
            <button onclick="calculate()" class="equals">=</button>
           
            <button onclick="appendToDisplay('1')">1</button>
            <button onclick="appendToDisplay('2')">2</button>
            <button onclick="appendToDisplay('3')">3</button>
            <button onclick="appendToDisplay('0')" style="grid-column: span 2;">0</button>
           
            <button onclick="appendToDisplay('.')">.</button>
            <button onclick="toggleSign()" class="scientific">±</button>
        </div>
    </div>

    <script>
        let memory = 0;
       
        function appendToDisplay(value) {
            // Replace constants with their actual values
            if (value === 'Math.PI') value = Math.PI;
            if (value === 'Math.E') value = Math.E;
            document.getElementById('display').value += value;
        }
       
        function clearDisplay() {
            document.getElementById('display').value = '';
        }
       
        function backspace() {
            const display = document.getElementById('display');
            display.value = display.value.slice(0, -1);
        }
       
        function calculate() {
            try {
                let expression = document.getElementById('display').value;
                // Replace × and ÷ with * and / for evaluation
                expression = expression.replace(/×/g, '*').replace(/÷/g, '/');
                const result = eval(expression);
                document.getElementById('display').value = result;
            } catch (error) {
                document.getElementById('display').value = 'Error';
            }
        }
       
        // Scientific functions
        function scientificFunction(func) {
            const display = document.getElementById('display');
            const value = parseFloat(display.value);
            try {
                display.value = eval(`${func}(${value})`);
            } catch (error) {
                display.value = 'Error';
            }
        }
       
        function squareRoot() {
            const display = document.getElementById('display');
            const value = parseFloat(display.value);
            display.value = Math.sqrt(value);
        }
       
        function power(exponent) {
            const display = document.getElementById('display');
            const value = parseFloat(display.value);
            display.value = Math.pow(value, exponent);
        }
       
        function powerFunction() {
            appendToDisplay('**');
        }
       
        function factorial() {
            const display = document.getElementById('display');
            let value = parseInt(display.value);
            let result = 1;
            for (let i = 2; i <= value; i++) {
                result *= i;
            }
            display.value = result;
        }
       
        function reciprocal() {
            const display = document.getElementById('display');
            const value = parseFloat(display.value);
            display.value = 1 / value;
        }
       
        function percentage() {
            const display = document.getElementById('display');
            const value = parseFloat(display.value);
            display.value = value / 100;
        }
       
        function toggleSign() {
            const display = document.getElementById('display');
            display.value = -parseFloat(display.value);
        }
       
        // Memory functions
        function memoryAdd() {
            const display = document.getElementById('display');
            memory += parseFloat(display.value) || 0;
            updateMemoryDisplay();
        }
       
        function memorySubtract() {
            const display = document.getElementById('display');
            memory -= parseFloat(display.value) || 0;
            updateMemoryDisplay();
        }
       
        function memoryClear() {
            memory = 0;
            updateMemoryDisplay();
        }
       
        function memoryRecall() {
            document.getElementById('display').value = memory;
        }
       
        function updateMemoryDisplay() {
            document.getElementById('memory-display').textContent = `Memory: ${memory}`;
        }
       
        // Keyboard support
        document.addEventListener('keydown', function(event) {
            if (event.key >= '0' && event.key <= '9') {
                appendToDisplay(event.key);
            } else if (event.key === '+' || event.key === '-' || event.key === '*' || event.key === '/') {
                appendToDisplay(event.key);
            } else if (event.key === 'Enter' || event.key === '=') {
                calculate();
            } else if (event.key === 'Escape') {
                clearDisplay();
            } else if (event.key === 'Backspace') {
                backspace();
            } else if (event.key === '(' || event.key === ')') {
                appendToDisplay(event.key);
            } else if (event.key === '.') {
                appendToDisplay('.');
            } else if (event.key === '%') {
                percentage();
            }
        });
    </script>
</body>
</html>
